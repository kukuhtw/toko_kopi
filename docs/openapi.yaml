openapi: 3.0.3
info:
  title: KopiBot MVP API
  version: 0.2.0
  description: MVP API for KopiBot AI Commerce Platform.
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service status
  /api/auth/register:
    post:
      summary: Register user
      responses:
        '200':
          description: Registration result
  /api/auth/login:
    post:
      summary: Login user
      responses:
        '200':
          description: JWT token result
  /api/products:
    get:
      summary: Product menu or search
      responses:
        '200':
          description: Product result
  /api/cart/add:
    post:
      summary: Add item to cart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart result
        '401':
          description: Unauthorized
  /api/cart/checkout:
    post:
      summary: Checkout cart and create payment link
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Checkout result
        '401':
          description: Unauthorized
  /api/chatbot/message:
    post:
      summary: Process chatbot message
      responses:
        '200':
          description: Chatbot response
